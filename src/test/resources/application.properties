spring.application.name=parkingLot_Spring

# Tests run against in-memory H2 so they never need a live MySQL instance.
spring.datasource.url=jdbc:h2:mem:parkinglot;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

parking.pricing.policy=TIME_BASED
parking.pricing.description=FEE WILL CALCULATE BASED ON TIME BASED.
parking.pricing.hourly-rate=100.00
parking.device.waiting-time=3m
parking.gate.open-timeout=10s
